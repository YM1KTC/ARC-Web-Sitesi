[build]
  publish = "dist"
  command = "npm run build"
  # Build kuralı:
  # 1) Sanity webhook (build hook) tetiklemeli build'leri ATLA — arka plandaki her
  #    içerik/taslak değişikliği tam build tetiklemesin. (INCOMING_HOOK_TITLE, hook
  #    tetiklemeli build'lerde set edilir.)
  # 2) Git push'larda ise yalnızca bcanata@hotmail.com yazarlı commit'lerde build al.
  # İçeriği canlıya almak için: bcanata ile git push, veya Netlify'da "Trigger deploy".
  ignore = "if [ -n \"$INCOMING_HOOK_TITLE\" ]; then exit 0; fi; git log -1 --pretty=format:'%ae' | grep -v 'bcanata@hotmail.com'"
[build.processing.html]
  pretty_urls = false
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# NOTE: When using output: 'server' with Netlify adapter,
# routing is handled automatically by the adapter.
# No manual redirect rules needed for SSR functionality.
