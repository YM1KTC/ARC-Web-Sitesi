[build]
  publish = "dist"
  command = "npm run build"
  # Build kuralı: main'e gelen her commit (main PR zorunluluğuyla korunuyor) ve
  # Sanity'de yayınlanan/güncellenen/silinen yazılar ("Sanity content change" build
  # hook'u) siteyi yeniden derler. Sanity taslak kaydetmeleri webhook tetiklemez.
[build.environment]
  # Astro 7 en az Node 22.23.4 ister; Netlify'da Node 24 (LTS) kullan.
  NODE_VERSION = "24"
[build.processing.html]
  pretty_urls = false
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# NOTE: When using output: 'server' with Netlify adapter,
# routing is handled automatically by the adapter.
# No manual redirect rules needed for SSR functionality.
